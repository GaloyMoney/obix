[package]
name = "obix"
version = "0.19.2"
edition = "2024"
license = "Apache-2.0"
description = "Implementation of outbox backed by PG / sqlx"
repository = "https://github.com/GaloyMoney/obix"
documentation = "https://docs.rs/obix"
categories = ["database"]

[features]

default = ["default-tables"]

fail-on-warnings = ["obix-macros/fail-on-warnings"]
tracing = [
  "es-entity/tracing-context",
  "obix-macros/tracing"
]
default-tables = []
test-utils = ["tokio/time"]

[dependencies]
obix-macros = { workspace = true }

es-entity = { workspace = true, features = ["errlanes-tracing"] }

serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
imbl = { workspace = true }
job = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
anyhow = { workspace = true }
serial_test = { version = "4", features = ["file_locks"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[workspace]
resolver = "2"
members = [
  "obix-macros",
]

[workspace.dependencies]

obix-macros = { path = "obix-macros", version = "0.19.2" }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
es-entity = "0.22.0"
anyhow = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8.6", features = ["macros", "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json" ] }
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
tracing = { version = "0.1" }
futures = "0.3"
imbl = { version = "7.0", features = ["serde"] }
job = { version = "0.20.0", features = ["es-entity"] }
async-trait = "0.1"
bon = "3"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"
uuid = "1"

[patch.crates-io]
es-entity = { git = "https://github.com/GaloyMoney/es-entity", rev = "1b1aadf76a93f7ef5fe51e4452dbf67b647a1f73" }
es-entity-macros = { git = "https://github.com/GaloyMoney/es-entity", rev = "1b1aadf76a93f7ef5fe51e4452dbf67b647a1f73" }
errlanes = { git = "https://github.com/GaloyMoney/es-entity", rev = "1b1aadf76a93f7ef5fe51e4452dbf67b647a1f73" }
errlanes-derive = { git = "https://github.com/GaloyMoney/es-entity", rev = "1b1aadf76a93f7ef5fe51e4452dbf67b647a1f73" }
