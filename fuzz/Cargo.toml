[package]
name = "obix-fuzz"
version = "0.8.6-dev"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
obix = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"], default-features = false }
uuid = { version = "1.0" }

[[bin]]
name = "fuzz_decode_persistent_event"
path = "fuzz_targets/fuzz_decode_persistent_event.rs"
test = false
doc = false

# Standalone workspace so the fuzz crate is excluded from the parent workspace
# (cargo-fuzz convention).
[workspace]
